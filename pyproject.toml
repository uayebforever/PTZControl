[project]
name = "PTZControl"
version = "0.1.0"
description = "PTZ Camera Controller system"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic",
    "pyside6",
    "pygame",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "types-mock",
    "tox",
    "build",
    "flake8",
    "basedpyright",
]

[project.scripts]
ptz-control = "ptz_control.__main__:main"

[project.urls]
"Homepage" = "https://github.com/pypa/sampleproject"
"Bug Tracker" = "https://github.com/pypa/sampleproject/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
